<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>OUBLIEMOTDEPASSE</title>
</head>
<style>
    body{
        display: grid;
        justify-content: center;
        align-items: center;
        background-color:  #D8E8F2;
    position: relative;
    top: 200px;
    }
    h1{
        color:  #052659;;
    }
    .formulaire input{
    
    background-color: #B8CCDD;
    border: 3px solid  #B8CCDD;
    display: block;
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    margin:  auto;
    position: relative; 
    outline: none;
    transition: all 0.3s ease;
   transform: scale(1.01);
     
  }
   .formulaire input:hover{
    transform: scale(1.1);
    box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
 
  }

  .confirm {
    border: 3px solid  #B8CCDD;
    display: block;
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin:  auto;
    position: relative;
    text-align: center;
    background-color: #799CBF;
   color:white;
   margin-bottom: 14px;
   top: 26px;
   
  }
  .confirm:hover{
    transform: scale(1.1);
  }
  .form {
    border: 3px solid  #B8CCDD;
    display: block;
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin:  auto;
    position: relative;
    text-align: center;
    background-color: #244667;
   color:white;
   margin-bottom: 14px;
   top: 26px;
  }
  a{
    text-decoration: none;
    color: white;
  }
</style>
<body>
    <h1>Forgot your password</h1>
    <div class="formulaire">
       
        <div class="password">
          <input type="password" id="inputt" placeholder="Définissez un nouveau mot de passe">
        </div>
            <div class="confirm">
              Confirmer le mot de passe
            </div>
            <div class="form"><a href="inscription1.html">Se connecter</a></div>
