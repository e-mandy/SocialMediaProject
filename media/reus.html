<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte Créé avec Succès</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #B8CCDD, #799CBF,#91AABF );
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .confirmation {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .reus {
            font-size: 4rem;
            color:  #244667;
            margin-bottom: 20px;
        }
        .connect {
            display: inline-block;
            padding: 12px 25px;
            font-size: 1rem;
            color: #fff;
            background:  #244667;
            text-decoration: none;
            border-radius: 25px;
            transition: background 0.3s ease;
        }
        .connect:hover {
            background:  #244667;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="confirmation">
        <div class="reus">✔</div>
        <h1>Félicitations !</h1>
        <p>Votre compte a été créé avec succès.</p>
        <a href="connexion.html" class="connect">Se connecter</a>
    </div>
</body>
</html>
